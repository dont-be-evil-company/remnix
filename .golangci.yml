version: "2"
linters:
  default: standard
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - \.direnv/
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - \.direnv/
