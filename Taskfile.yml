# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: Lists all available tasks
    cmds:
      - task --list
    silent: true
  build:
    desc: Builds the binary
    cmds:
      - make build
    silent: true
  install:
    desc: Installs the remnix to $HOME/.local/bin/remnix
    cmds:
      - mv ./bin/remnix $HOME/.local/bin/remnix
      - mv ./bin/remnix-attach $HOME/.local/bin/remnix-attach
    silent: true
  fmt:
    desc: Formats all files
    cmds:
      - go fmt ./...
    silent: true
  lint:
    desc: Runs vet on all files
    cmds:
      - go vet ./...
    silent: true
  test:
    desc: Runs tests
    cmds:
      - go test ./...
    silent: true
  ci:
    desc: Runs golangci-lint
    cmds:
      - golangci-lint run ./...
    silent: true
